name: CI

on:
  push:
    branches: [main, master, feat/nstline-mvp]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/NStLine.slnx

      - name: Build
        run: dotnet build src/NStLine.slnx -c Release --no-restore

      - name: Test
        run: dotnet test src/NStLine.slnx -c Release --no-build
